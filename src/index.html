<!-- ICONS-END -->
  <!-- Píldora pequeña (se muestra al pasar el ratón por el borde superior;
       clic para desplegar el panel completo) -->
  <div id="pill" class="pill" title="Haz clic para desplegar">
    <div id="pill-player" class="pill-player hidden">
      <img id="pp-cover" alt="" draggable="false" />
      <span id="pp-title" class="pp-title"></span>
      <button id="pp-toggle" class="pp-btn" title="Pausa/Reproducir">
        <svg class="ic"><use id="pp-use" href="#i-play"/></svg>
      </button>
    </div>
    <span class="pill-right">
      <span id="clock" class="clock">--:--</span>
      <span class="pill-icons">
      <svg id="ic-wifi" class="ic ic-wifi"><use href="#i-wifi"/></svg>
      <span id="wifi-off" class="hidden">📶?</span>
      <span id="battery" class="battery hidden">
        <span class="battery-text" id="battery-text">--</span>
        <svg viewBox="0 0 28 14" width="24" height="12"><rect x="1" y="2" width="22" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect id="battery-fill" x="3" y="4" width="0" height="6" rx="1" fill="currentColor"/><rect x="24.5" y="5" width="2.5" height="4" rx="1" fill="currentColor"/></svg>
      </span>
      </span>
    </span>
  </div>

  <!-- Estado expandido: carrusel de widgets -->
  <div id="panel" class="panel hidden" aria-expanded="false">
    <header class="panel-top">
      <button id="nav-prev" class="nav" title="Anterior"><svg class="ic"><use href="#i-chevron-left"/></svg></button>
      <div id="page-title" class="page-title">Music</div>
      <button id="gear" class="gear" title="Ordenar páginas">
        <svg class="ic"><use href="#i-adjustments-horizontal"/></svg>
      </button>
      <button id="nav-next" class="nav" title="Siguiente"><svg class="ic"><use href="#i-chevron-right"/></svg></button>
    </header>
    <main id="page-host" class="page-host"></main>
    <footer class="panel-bottom">
      <div id="dots" class="dots"></div>
      <button id="close-panel" class="close" title="Colapsar"><svg class="ic"><use href="#i-x-mark"/></svg></button>
    </footer>
  </div>

  <script type="module" src="core/dock.js"></script>
</body>
</html>
