[package]
name = "dynisland"
version = "0.1.0"
description = "Dynamic Island de escritorio, ultraligera (Tauri 2 + Rust)"
edition = "2021"
authors = ["zLeGnDz3r0"]
homepage = "https://github.com/zLeGnDz3r0/DynIsland"
repository = "https://github.com/zLeGnDz3r0/DynIsland"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_NetworkManagement_WiFi",
] }

# Binario final pequeño: LTO total, un solo código, strip de símbolos.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
